<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat with us</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:#f6f7fb; color:#1c1f26; height:100vh; display:flex; flex-direction:column; }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .m { max-width:82%; padding:10px 13px; border-radius:14px; white-space:pre-wrap; }
  .u { align-self:flex-end; background:#4a6cf7; color:#fff; } .a { align-self:flex-start; background:#fff; border:1px solid #e3e6ee; }
  form { display:flex; gap:8px; padding:12px; background:#fff; border-top:1px solid #e3e6ee; }
  input { flex:1; padding:11px 13px; border:1px solid #d5d9e3; border-radius:10px; font:inherit; }
  button { border:0; background:#4a6cf7; color:#fff; border-radius:10px; padding:0 18px; font:inherit; font-weight:600; cursor:pointer; }
  .n { font-size:12px; color:#6b7280; text-align:center; padding:6px; }
</style>
</head>
<body>
<div id="log"></div>
<div class="n">You are chatting with an AI assistant. Conversations may be saved to help the business serve you.</div>
<form id="f"><input id="t" placeholder="Type your message..." autocomplete="off" maxlength="1000"><button>Send</button></form>
<script>
const log = document.getElementById("log"), input = document.getElementById("t");
const employeeId = new URLSearchParams(location.search).get("e");
let conv = null, token = null, closed = false;
const add = (cls, text) => { const d = document.createElement("div"); d.className = "m " + cls; d.textContent = text; log.appendChild(d); log.scrollTop = log.scrollHeight; };
async function post(url, body) {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
  const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.error || "Something went wrong"); return d;
}
(async () => {
  try { const s = await post(`/public/chat/${encodeURIComponent(employeeId)}/start`); conv = s.conversationId; token = s.token; add("a", s.greeting); }
  catch (e) { add("a", "Sorry, this assistant is not available right now."); closed = true; }
})();
document.getElementById("f").onsubmit = async (e) => {
  e.preventDefault(); const text = input.value.trim(); if (!text || !conv || closed) return;
  input.value = ""; add("u", text);
  try {
    const r = await post(`/public/chat/${conv}/message`, { token, content: text });
    if (r.reply) add("a", r.reply);
    if (r.handoff) add("a", "A team member has been notified and will reply here or contact you soon.");
    if (r.closed) closed = true;
  } catch (err) { add("a", "Sorry, I could not send that. " + err.message); }
};
</script>
</body>
</html>
